
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09051f">
  <meta name="description" content="Sonic Max: aventura web 2D de estilo retro de 16 bits.">
  <title>SONIC MAX — 16-Bit Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="intro" aria-label="Introducción de Sonic Max">

    <div class="stars" aria-hidden="true"></div>
    <div class="sun" aria-hidden="true"></div>

    <div class="scene-title">
      <span>AN ORIGINAL FAN PROJECT</span>
      <strong>GREEN HILL ZONE</strong>
    </div>

    <div class="mountains" aria-hidden="true"></div>

    <div class="palm palm-one" aria-hidden="true">🌴</div>
    <div class="palm palm-two" aria-hidden="true">🌴</div>

    <div class="ground" aria-hidden="true">
      <div class="ground-grass"></div>
      <div class="ground-pattern"></div>
    </div>

    <!-- PERSONAJES -->

    <div class="character sonic" id="sonic"
         aria-label="Sonic">
      <div class="quills"></div>
      <div class="face"><div class="eye"></div></div>
      <div class="body"></div>
      <div class="glove"></div>
      <div class="shoe"></div>
    </div>

    <div class="character tails" id="tails"
         aria-label="Tails">
      <div class="tails-tails"></div>
      <div class="quills"></div>
      <div class="face"><div class="eye"></div></div>
      <div class="body"></div>
      <div class="glove"></div>
      <div class="shoe"></div>
    </div>

    <div class="character knuckles" id="knuckles"
         aria-label="Knuckles">
      <div class="quills"></div>
      <div class="face"><div class="eye"></div></div>
      <div class="body"></div>
      <div class="glove"></div>
      <div class="shoe"></div>
    </div>

    <div class="character shadow" id="shadow"
         aria-label="Shadow">
      <div class="quills"></div>
      <div class="face"><div class="eye"></div></div>
      <div class="body"></div>
      <div class="glove"></div>
      <div class="shoe"></div>
    </div>

    <div class="character rouge" id="rouge"
         aria-label="Rouge">
      <div class="wings"></div>
      <div class="quills"></div>
      <div class="face"><div class="eye"></div></div>
      <div class="body"></div>
      <div class="glove"></div>
      <div class="shoe"></div>
    </div>

    <div class="character amy" id="amy"
         aria-label="Amy">
      <div class="quills"></div>
      <div class="face"><div class="eye"></div></div>
      <div class="body"></div>
      <div class="glove"></div>
      <div class="shoe"></div>
    </div>

    <div class="character sach" id="sach"
         aria-label="Sach">
      <div class="quills"></div>
      <div class="face"><div class="eye"></div></div>
      <div class="body"></div>
      <div class="glove"></div>
      <div class="shoe"></div>
      <div class="energy"></div>
    </div>

    <!-- PANTALLA DEL TÍTULO -->

    <section class="title-screen" id="titleScreen">
      <div class="logo-emblem">✦</div>
      <p class="edition">THE NEXT 16-BIT ADVENTURE</p>

      <h1>SONIC <span>MAX</span></h1>

      <p class="subtitle">
        SIETE PERSONAJES · UNA NUEVA AVENTURA
      </p>

      <button id="continueButton" type="button">
        ▶ PULSA PARA CONTINUAR
      </button>

      <p class="press-note">
        UNA AVENTURA DE SHADOWMAX
      </p>
    </section>

    <p class="copyright">
      SONIC MAX · FAN PROJECT · 16-BIT STYLE
    </p>

  </main>

  <script src="script.js"></script>
</body>
</html>
